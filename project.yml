name: Timber
options:
  bundleIdPrefix: uk.co.stener
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  timber-mcp:
    type: tool
    platform: macOS
    sources:
      - Sources/Core
      - Sources/MCP
    settings:
      base:
        PRODUCT_NAME: timber-mcp
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.stener.timber.mcp
      configs:
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
          DEVELOPMENT_TEAM: MRJW6XNT7S
          ENABLE_HARDENED_RUNTIME: YES
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  Timber:
    type: application
    platform: macOS
    sources:
      - Sources/Core
      - Sources/App
      - Resources
    dependencies:
      - target: timber-mcp
        embed: true
        codeSign: false
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: Timber
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Chop down what you don't need."
        NSDesktopFolderUsageDescription: Timber measures your Desktop so it can show what's taking up space.
        NSDocumentsFolderUsageDescription: Timber measures your Documents so it can show what's taking up space.
        NSDownloadsFolderUsageDescription: Timber measures your Downloads so it can find forgotten big files.
        NSRemovableVolumesUsageDescription: Timber measures removable drives you ask it to survey.
        NSNetworkVolumesUsageDescription: Timber measures network drives you ask it to survey.
        NSAppleEventsUsageDescription: Timber asks Finder to empty the Trash when you haul away chopped wood.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.stener.timber
        CODE_SIGN_ENTITLEMENTS: Resources/Timber.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
          DEVELOPMENT_TEAM: MRJW6XNT7S
          ENABLE_HARDENED_RUNTIME: YES
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
